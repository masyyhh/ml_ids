services:
  sentinelml-ids:
    build: .
    container_name: sentinelml_ids
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    # Network mode host or cap_add NET_ADMIN/NET_RAW enables hardware Scapy sniffing inside container
    cap_add:
      - NET_ADMIN
      - NET_RAW
